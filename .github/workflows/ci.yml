name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: fake
      SEARCH_PROVIDERS: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests evals
      - run: pytest -q
      - name: CLI smoke run (fake model + offline search)
        run: research run "How does hybrid search improve retrieval?" --thread ci
